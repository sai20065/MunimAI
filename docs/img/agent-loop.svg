<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img" aria-label="The agent loop: hear, decide, act, check, remember">
  <defs>
    <marker id="ar" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1,1 L10,6 L1,11 Z" fill="#6A68A8"/></marker>
  </defs>
  <rect width="1200" height="330" rx="24" fill="#F5F3FF"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" fill="#14143A">
    <g>
      <rect x="30" y="60" width="200" height="190" rx="22" fill="#4DB8FF"/>
      <text x="130" y="112" font-size="44">🎧</text>
      <text x="130" y="158" font-size="32" font-weight="800">1 Hear</text>
      <text x="130" y="192" font-size="20">Voice, text, photos</text>
      <text x="130" y="216" font-size="20">Bhashini → text</text>
    </g>
    <g>
      <rect x="260" y="60" width="200" height="190" rx="22" fill="#9B7BFF"/>
      <text x="360" y="112" font-size="44">🧭</text>
      <text x="360" y="158" font-size="32" font-weight="800">2 Decide</text>
      <text x="360" y="192" font-size="20">A rule-based router</text>
      <text x="360" y="216" font-size="20">picks the right agent</text>
    </g>
    <g>
      <rect x="490" y="60" width="200" height="190" rx="22" fill="#3FE0A8"/>
      <text x="590" y="112" font-size="44">🛠️</text>
      <text x="590" y="158" font-size="32" font-weight="800">3 Act</text>
      <text x="590" y="192" font-size="20">Read bills, look up</text>
      <text x="590" y="216" font-size="20">rules, build the file</text>
    </g>
    <g>
      <rect x="720" y="60" width="200" height="190" rx="22" fill="#FFB547"/>
      <text x="820" y="112" font-size="44">🛡️</text>
      <text x="820" y="158" font-size="32" font-weight="800">4 Check</text>
      <text x="820" y="192" font-size="20">An auditor blocks any</text>
      <text x="820" y="216" font-size="20">claim with no source</text>
    </g>
    <g>
      <rect x="950" y="60" width="220" height="190" rx="22" fill="#FF8FAE"/>
      <text x="1060" y="112" font-size="44">🧠</text>
      <text x="1060" y="158" font-size="32" font-weight="800">5 Remember</text>
      <text x="1060" y="192" font-size="20">Books, documents,</text>
      <text x="1060" y="216" font-size="20">consent, replayable trace</text>
    </g>
  </g>
  <g stroke="#6A68A8" stroke-width="5" fill="none" marker-end="url(#ar)">
    <path d="M232,155 L256,155"/><path d="M462,155 L486,155"/><path d="M692,155 L716,155"/><path d="M922,155 L946,155"/>
  </g>
  <text x="600" y="38" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="700" fill="#5B38D0">Every request goes around this loop</text>
  <text x="600" y="296" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#C8244E">Then it stops. The owner reviews and decides. Agents never file or submit.</text>
</svg>
